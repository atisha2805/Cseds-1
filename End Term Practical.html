<html>
<head>
    <title>Product Webpage</title>
    <style>
        div{
           border:2px solid black;
           margin:30px;
           padding:10px;
           background-color:grey;
        }
       .product{
           border:1px solid grey;
           margin:0 0 0 400;
           padding:10px;
           width:300px;
           background-color: white;
       }
       h1{
          text-align: center;
          color: white;
          background-color: black;
          border:2px solid black;
       }
      img{
          display:block;
          margin-left: 10px;
          margin-right: 10px;
          height: 300px;
          width: 300px;
      }
      .price{
          color: green;
      }
      strike{
          color: grey;
      }
      button{
          background-color: red;
          color: white;
          border:1px solid black;
          font-size: 16px;
          height:"30px";
          width:"30px";
      }
   </style>
</head>
<body>
   <div>
        <h1>Oswaal Sample Papers 2026</h1>
        <div class="product">
        <center>
            <img src="https://oswaalbooks.com/cdn/shop/files/9789373019024_3ab8044e-9d69-487b-8755-29523bf50af0_1024x.png?v=1764591529" alt="Oswaal book cover">
            <h3>Oswaal Book</h3>
            <p>CBSE Sample Question Papers Class 10 English, Science, Social Science & Maths Standard (Set of 4 Books) (For Board Exams 2026)</p>
            <p class="price">&#8377;1,396 <strike>&#8377;1,746</strike></p>
            <button onclick="add-to-cart">Add to Cart</button>
            <button onclick="buy-now">Buy Now</button>
        </center>
        </div>
    </div> 
</body>
</html>
